name: Coverity Bridge CLI Scaning 150

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverity:
    name: Coverity Full Scan
    runs-on: ubuntu-latest

    env:
      BRIDGE_COVERITY_CONNECT_URL: ${{ secrets.BRIDGE_COVERITY_CONNECT_URL }}
      BRIDGE_COVERITY_CONNECT_USER_NAME: ${{ secrets.BRIDGE_COVERITY_CONNECT_USER_NAME }}
      BRIDGE_COVERITY_CONNECT_USER_PASSWORD: ${{ secrets.BRIDGE_COVERITY_CONNECT_USER_PASSWORD }}

      BRIDGE_COVERITY_LOCAL: "true"
      BRIDGE_COVERITY_BUILD_COMMAND: "./mvnw -B -DskipTests package"
      BRIDGE_COVERITY_CLEAN_COMMAND: "./mvnw -B clean"

      BRIDGE_GITHUB_REPOSITORY_OWNER_NAME: ${{ github.repository_owner }}
      BRIDGE_GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      BRIDGE_GITHUB_REPOSITORY_BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        shell: bash
        run: chmod +x ./mvnw

      - name: Install Coverity certificate
        shell: bash
        env:
          COVERITY_CERT: ${{ secrets.COVERITY_CERT }}
        run: |
          printf '%s\n' "$COVERITY_CERT" | sed 's/\r$//' \
            | sudo tee /usr/local/share/ca-certificates/coverity.crt > /dev/null

          sudo update-ca-certificates

          echo "Certificate information:"
          openssl x509 \
            -in /usr/local/share/ca-certificates/coverity.crt \
            -noout \
            -subject \
            -issuer \
            -dates

      - name: Test Coverity connectivity
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            --connect-timeout 20 \
            "${BRIDGE_COVERITY_CONNECT_URL}/"

      - name: Download Bridge CLI
        shell: bash
        run: |
          curl -fLsS \
            -o bridge.zip \
            "https://repo.blackduck.com/artifactory/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip"

          unzip -qo bridge.zip -d "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/bridge-cli-bundle-linux64/bridge-cli"

          "${RUNNER_TEMP}/bridge-cli-bundle-linux64/bridge-cli" --version || true

      - name: Run Coverity full scan
        shell: bash
        run: |
          "${RUNNER_TEMP}/bridge-cli-bundle-linux64/bridge-cli" \
            --stage connect \
            coverity.connect.project.name="WebGoat-GitHub" \
            coverity.connect.stream.name="WebGoat-GitHub-main"

      - name: Upload Bridge diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverity-bridge-logs
          path: |
            .bridge
            ~/.bridge
          include-hidden-files: true
          if-no-files-found: ignore
